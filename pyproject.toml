[project]
name = "canvasbuddy"
version = "0.1.0"
description = "StudyBuddy — your Canvas courses in Telegram and Slack. Morning digest, evening nudges, Saturday review."
authors = [{ name = "Mir Sadat Bin Rakib" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # [job-queue] pulls APScheduler, which runs on the bot's own event loop. Without
    # this extra `Application.job_queue` is None and the scheduled sync and digest
    # silently never run.
    "python-telegram-bot[job-queue]==22.8",
    "typer>=0.15",
    "tenacity>=9.0",
    # Windows ships no system tz database, and slim Linux images often omit it.
    "tzdata>=2024.2",
    # Syllabus extraction. Three formats because instructors publish all three:
    # .docx (python-docx), .pdf (pypdf), and pre-2007 binary .doc (olefile).
    "pypdf>=5.1",
    "python-docx>=1.1",
    "olefile>=0.47",
    "fastapi>=0.115",
]

[project.scripts]
canvasbuddy = "canvasbuddy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvasbuddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
